  summary: Samit Shahnawaz Miftah is a PhD researcher in Computer and Systems Engineering at Rensselaer Polytechnic Institute, specializing in hardware security, formal verification, and AI-driven design automation. With 10 peer-reviewed publications across top venues including IEEE MICRO, ACM/IEEE DAC, and IEEE TCAD, his work advances automated and intelligent methodologies for securing next-generation hardware systems. He is also a two-time top finisher at Hack@DAC — the world's premier hardware security competition — and a CSAW AI Hardware Attack Challenge awardee.

